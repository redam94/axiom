[project]
name = "axiom"
version = "1.1.0"
description = "Bayesian causal decision science: identification, experimental design and calibration, response-surface methodology, and evidence meta-analysis"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Reda", email = "m.reda94@gmail.com" }]
requires-python = ">=3.12"

# ---------------------------------------------------------------------------
# THE DEPENDENCY BUDGET IS A DESIGN CONSTRAINT, NOT AN ACCIDENT.
#
# `pip install axiom` must give a working *design + planning + meta-analysis*
# toolkit with NO sampler, NO plotting stack, NO compiler toolchain. Every
# module under core/ identify/ design/ data/ io/ build/ and the closed-form half
# of meta/ and surface/ is numpy+scipy+pandas+pydantic only.
#
# Sampling is an EXTRA because it is the single heaviest thing we could pull in:
#   [numpyro] ~ 252 MB on disk (jaxlib alone is 228 MB)
#   [pymc]    ~ 177 MB on disk (llvmlite alone is 113 MB, plus a C++ toolchain
#              at runtime -- the macOS clang trap the parent repo documents)
# Core, by contrast, is ~160 MB and almost all of that is numpy/scipy/pandas.
#
# tests/contracts/test_import_weight.py pins this: `import axiom` must not put
# jax, numpyro, pymc, pytensor, or plotly into sys.modules.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "pandas>=2.3",
    "pydantic>=2.12",
]

[project.optional-dependencies]
# Default inference backend. JAX/NumPyro: no compiler at runtime, one wheel.
numpyro = [
    "numpyro>=0.19",
    "jax>=0.8",
    "arviz-base>=1.2",
    "arviz-stats>=1.2",
]
# Alternative backend for models NumPyro serves badly (discrete latents without
# enumeration, some hierarchies). Optional on purpose -- see the note above.
#
# PyMC is the one backend that dispatches NUTS to a *choice* of sampler over the
# same compiled log density: its own, nutpie (Rust, usually the fastest here),
# numpyro (needs axiom[numpyro] as well) and blackjax (likewise, via jax).
# nutpie is in this extra because it is small and is the sampler we default to
# recommending; the other two ride along with the extras that already carry jax.
# `infer.samplers(probe=True)` reports which are actually usable against the
# installed PyMC -- an external sampler can import cleanly and still be out of
# step with it, which is not the same thing as installed.
pymc = [
    "pymc>=6.0.1",
    "nutpie>=0.16",
    "arviz-base>=1.2",
    "arviz-stats>=1.2",
]
# Posterior persistence to netCDF (io.serialize `trace` flavor). Without it,
# posteriors round-trip as npz and the DataTree groups are flattened.
netcdf = ["h5netcdf>=1.6.4", "h5py>=3.12"]
# Hard-constrained allocation on a fitted surface (surface.optimize with
# sign/box/simplex constraints a prior cannot make impossible).
convex = ["cvxpy>=1.5"]
# Differentially-private benchmark publication (meta.privacy / meta.publish).
privacy = ["scipy>=1.16"]
# Figures. Never imported by core.
viz = ["plotly>=6.5"]
# Styled terminal and notebook output for every result type. rich is pure
# python and imports in 0.018s against pandas' 0.407s, but it is an extra
# rather than a dependency because `axiom.display` works without it: the same
# card renders as aligned plain text, and the four-package core holds.
display = ["rich>=13"]
# Static report output: slides and paged PDF. HTML needs none of this -- it keeps
# plotly figures live and only wants the viz extra. kaleido ships a browser engine
# to turn a figure into a PNG, which is exactly why it is not a core dependency.
report = ["axiom[viz]", "python-pptx>=1.0", "reportlab>=4.0", "kaleido>=1.0"]
# Everything. Heavy on purpose: this is what `uv sync --group dev` installs so
# that CI can run the backend-equivalence gate and the infer notebooks, both of
# which compare all three backends against each other.
all = ["axiom[numpyro,pymc,netcdf,convex,privacy,viz,display,report]"]

[dependency-groups]
dev = [
    "axiom[all]",
    "black>=24.0",
    "ruff>=0.13",
    "mypy>=1.11",
    "pytest>=9.0",
    "pytest-xdist>=3.8",
    "pytest-cov>=7.0",
    "ipykernel>=7.1",
    "nbmake>=1.5",
    "pandas-stubs>=3.0.5.260730",
    "scipy-stubs>=1.18.0.1",
]
docs = ["sphinx>=8.0", "furo>=2024.8", "myst-parser>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

# Add-on packages that depend on axiom and are developed alongside it. They are
# separate distributions with their own version and their own tests: `pip install
# axiom` does not install any of them, and axiom never imports one. The charter
# keeps rendering and any language model out of axiom itself; packages/ is where
# that work is allowed to live.
[tool.uv.workspace]
members = ["packages/*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
# BLE001 is on deliberately: the parent repo shipped four silent-degradation
# bugs behind bare `except Exception`. See docs/plan/04-contracts-and-testing.md.

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's default `norecursedirs` contains "build", which silently excluded
# `nbs/build/` from `make notebooks`: the builders notebook had never once been
# executed in CI, and nothing reported it — a skipped directory looks exactly
# like a directory with nothing in it. Set explicitly so that a subpackage's
# name cannot decide whether its deliverable is tested.
norecursedirs = [".*", "dist", "node_modules", "venv", "*.egg"]
markers = [
    "slow: long-running (sampling) tests",
    "golden: compares against fixtures captured from mmm-framework",
    "recovery: recovers known ground truth from axiom.sim",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/axiom"]

# Optional report backends that ship no type information. They are reached only
# from axiom.report.render.*, always behind a try/ImportError that returns a typed
# Unsupported, so nothing in axiom's own surface loses a type to this.
[[tool.mypy.overrides]]
module = ["pptx.*", "reportlab.*", "kaleido.*"]
ignore_missing_imports = true

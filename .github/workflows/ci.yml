name: ci

on:
  push:
  pull_request:

jobs:
  # The load-bearing job: proves the four-dependency claim. Fails the moment
  # someone adds a top-level sampler import. See docs/plan/04.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Deliberately NOT --locked: this job is the canary for `pip install
      # axiom` against a fresh resolution of the four dependencies. It is the
      # one job allowed to drift, because drifting is what it is for.
      - run: uv pip install --system -e . pytest
      - run: pytest tests/contracts tests/unit -q -m "not slow"
      # Phase 7 exit criterion 3: meta-analysis (classical path) works on core alone.
      - run: pytest tests/unit/test_meta_classical.py tests/unit/test_meta_influence.py -q

  full:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --locked
      - run: uv run pytest tests/ -n logical -m "not slow"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --locked
      - run: uv run black --check --diff src tests examples
      - run: uv run ruff check src tests examples
      - run: uv run mypy

  slow:
    if: github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev --locked
      - run: uv run pytest tests/ -n logical -m slow

  # The API reference must build warning-free (see `make docs`), and it must do
  # it on the *core* install alone -- which is what Read the Docs has. Building
  # this against the dev group would pass while the published reference broke,
  # because a top-level `import plotly` is invisible with plotly installed. So
  # this job is the second half of the four-dependency claim the `core` job
  # makes: autodoc imports every subpackage, and nothing optional may be needed
  # to do it. Keep the command in step with .readthedocs.yaml.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same two commands .readthedocs.yaml runs, so this job fails for the
      # same reasons the published build would. PEP 735 groups need pip 25.1.
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install . --group docs
      - run: >-
          python -m sphinx -W --keep-going -b html
          -d docs/_build/doctrees docs docs/_build/html

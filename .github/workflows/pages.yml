name: pages

# Publishes site/ to GitHub Pages. The site is fully static and committed, so this
# only uploads it — the numbers and figures are regenerated deliberately by running
# site/_gen/generate.py, not on every push (it fits models).
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the built pages are present
        run: |
          for page in index tutorial identify design calibrate surface meta examples benchmarks case-study rutherford api; do
            test -f "site/$page.html" || { echo "missing site/$page.html"; exit 1; }
          done
          test -d site/assets/data || { echo "missing site/assets/data"; exit 1; }
          walkthroughs=$(ls site/example-*.html 2>/dev/null | wc -l)
          test "$walkthroughs" -eq 12 || {
            echo "expected 12 example walkthroughs, found $walkthroughs"; exit 1; }
          steps=$(ls site/tutorial-*.html site/scattering-*.html 2>/dev/null | wc -l)
          test "$steps" -eq 14 || {
            echo "expected 14 tutorial steps, found $steps"; exit 1; }
          echo "$(ls site/assets/data/*.json | wc -l) data files, $(ls site/*.html | wc -l) pages"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

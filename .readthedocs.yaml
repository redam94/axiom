# Read the Docs build for the Sphinx API reference under docs/.
#
# Read the Docs *pulls*: connect the repository once at https://readthedocs.org
# (Import a Project -> redam94/axiom), and every push to a tracked branch builds
# from this file. `make docs_publish` triggers one on demand without waiting for
# a push. `make docs` builds the identical thing locally.
#
# GitHub Pages publishes site/ from main and is unrelated to this: that is the
# hand-written narrative site, this is the generated reference.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      # PEP 735 dependency groups need pip 25.1 or newer. Installing the `docs`
      # group rather than a requirements file keeps one set of pins, in
      # pyproject.toml, where `make docs` reads them too.
      - python -m pip install --upgrade "pip>=25.1"
      - python -m pip install . --group docs
    build:
      html:
        # The same command as `make docs`, warnings fatal included: a reference
        # that is allowed to build with warnings is one that quietly loses a
        # page. `-d` keeps Sphinx's doctree cache out of the artifact — inside
        # it, the upload is 270 MB of pickles against 23 MB of HTML.
        - >-
          python -m sphinx -W --keep-going -b html
          -d "$READTHEDOCS_OUTPUT/../doctrees"
          docs "$READTHEDOCS_OUTPUT/html"

# Nothing is installed beyond the core four and the docs group. Every optional
# dependency — pymc, numpyro, plotly, cvxpy, reportlab, kaleido — is imported
# lazily by the subpackage that needs it, so autodoc imports the whole of axiom
# without them and the build stays inside Read the Docs' limits. Confirmed by
# building against a core-only environment: warning-free under -W.
